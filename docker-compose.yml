services:
  live:
    build: .
    container_name: tku-live-translate
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      GLOSSARY_PATH: /srv/data/glossary.json
    volumes:
      - ./data:/srv/data
